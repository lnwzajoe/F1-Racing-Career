  const o=PO[k];if(S.posts<=0||S.money<o[2])return;

function pickAk(){
  const nn=(S.res||[]).length||8,dn=(S.res||[]).filter(p=>!p).length,rk=S.rank||9,th=(S.nat||'').startsWith('Thai');
  let p=Object.keys(AK).filter(k=>k!='Thai Pride'||th);

function mkField(){

    if(n===S.team&&ds.length>1){let i=ds.findIndex(x=>x.d===S.rival);if(i<0)i=RI(0,ds.length-1);ds=[ds[i]]}
    ds.forEach(x=>f.push({n,c:n===S.team?S.car:c,d:x.d,f:x.f,r:x.r+R(-3,3),p:0,w:0,pd:0,me:0,rv:x.d===S.rival?1:0,wid:x.id}));

function mkOffers(){
  const rk=S.rank,t=S.tier,o=[{tier:t,n:S.team,c:S.car,tag:'ต่อสัญญา'}],has=(n,tt)=>o.some(x=>x.n===n&&x.tier===tt);
  const wpick=(arr,k,wf)=>{const a=arr.slice(),r=[];while(r.length<k&&a.length){const ws=a.map(wf),tot=ws.reduce((x,y)=>x+y,0);let q=Math.random()*tot,i=0;while(i<a.length-1&&q>=ws[i]){q-=ws[i];i++}r.push(a[i]);a.splice(i,1)}return r};
  const add=(tt,tag,arr,k,wf)=>wpick(arr.filter(x=>!has(x[0],tt)),k,wf||(()=>1)).forEach(([n,c])=>o.push({tier:tt,n,c,tag}));
  if(t==3)add(3,'ย้ายทีม',T[3].t.filter(x=>x[0]!==S.team),3,x=>tw(x[1]));
  else{
    if(t==2&&rk<=5)add(3,'สู่ F1!',T[3].t,3,x=>tw(x[1]));
    else if(t<2&&rk<=5){const nx=[...T[t+1].t].sort((a,b)=>b[1]-a[1]).slice([0,0,2,4,5,6][rk]);add(t+1,'เลื่อนชั้น',nx,2)}
    add(t,'ย้ายทีม',T[t].t.filter(x=>x[0]!==S.team&&(rk<=8?x[1]>S.car:x[1]<S.car)),1);
  }
  if(rk>=14&&t>0)add(t-1,'ลงไปตั้งหลัก',[...T[t-1].t].sort((a,b)=>b[1]-a[1]).slice(0,3),1);
  o.forEach((x,i)=>{x.sal=salFor(x.tier,x.c);x.cmp=i==0?S.cmp:cmpOf(x.n,x.c)});
  S.offers=o;S.sel=0;go('offer');
}

function accept(i){

  return `<h1>🏁 จบอาชีพ</h1><div class="card"><h2>${esc(S.name)} · ${t}</h2>${S.aka?'<b>“'+S.aka+'”</b> <span class="mu">'+AK[S.aka][0]+'</span><br>':''}<span class="mu">เลิกแข่งตอนอายุ ${S.age} เพราะ ${S.rsn?S.rsn+' ('+RT[S.rsn]+')':'-'}</span><br><br>สัญชาติ ${S.nat||'-'} · ลีกสูงสุด ${T[c.maxTier].n}<br>ซีซั่น ${c.seasons} · แข่ง ${c.races} สนาม<br>ชนะ ${c.wins} · โพเดียม ${c.pod} · แต้มรวม ${c.pts}<br>แชมป์ ${c.titles} สมัย (F1: ${c.f1t})<br>ผู้ติดตาม ${nf(S.fol)} · ทรัพย์สินรวม ${fmt(S.money+iv)}<br>อันดับดีที่สุด ${c.best==99?'-':c.best}${S.rival?'<br>คู่แข่ง '+S.rival+': คุณชนะเขา '+S.beat+' ซีซั่น':''}</div>${S.inHof?'<div class="card" style="border-color:var(--gd)"><h2>🏛 เข้าสู่ Hall of Fame!</h2></div>':''}${tro(c.wins,c.pod,c.f1t,c.titles-c.f1t)}<div class="card"><h2>ประวัติรายปี</h2></div>${c.hist.slice().reverse().map(seasL).join('')}<button class="p" onclick="toStart()">เริ่มอาชีพใหม่</button>`;
}
function startV(){return `<h1>🏎️ Journey to F1</h1><p class="mu">เริ่มขับตอนอายุ 15 หมุนวงล้อโชคชะตา อัปเกรดนักแข่งและรถ หาสปอนเซอร์ แล้วไต่จาก F4 สู่ F1 ให้ได้</p><div class="card"><label class="mu" for="nm">ตั้งชื่อนักแข่งของคุณ</label><input id="nm" maxlength="20" placeholder="เช่น P.Pholmark" value="${esc(lastName())}" autocomplete="off"><label class="mu" for="nt" style="display:block;margin-top:12px">สัญชาติ</label><select id="nt">${Object.keys(FL).map(k=>`<option value="${k}" ${k==lastNat()?'selected':''}>${FL[k]} ${k}</option>`).join('')}</select></div><button class="p" onclick="startNew()">เริ่มอาชีพใหม่</button>`}
function render(){
  const a=document.getElementById('app');
  if(!S){a.innerHTML=startV();return}
  if(S.pv!=null&&!S.ph.startsWith('w:')&&S.ph!='end'){a.innerHTML=topbar(0)+profV();return}
  const p=S.ph;let h='';
  if(p.startsWith('w:'))h=wheelV();
  else if(p=='end')h=endV();
  else if(p=='off')h=offV();
  else if(p=='offer')h=offerV();
  else{
    const t=S.tab||'home';
    h=topbar(1)+({home:homeV,season:seasonV,stand:standV,team:teamV,shop:shopV,rider:riderV}[t])()+(t=='home'?'<button class="s" onclick="restart()">เริ่มอาชีพใหม่</button>':'')+'<div class="nav">'+NV.map(([k,i,l])=>'<button class="'+(t==k?'on':'')+'" onclick="tab(\''+k+'\')"><span>'+i+'</span>'+l+'</button>').join('')+'</div>';
  }
  a.innerHTML=h;
}
S=load();if(S&&!S.D)initWorld();render();
</script>
